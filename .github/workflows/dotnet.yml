name: .NET

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore GrandpaLegacyDialogue.sln

      - name: Build solution
        run: dotnet build GrandpaLegacyDialogue.sln --configuration Release --no-restore
